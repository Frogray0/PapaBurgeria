<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Papa's Burgeria Unblocked</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #000;
      overflow: hidden;
    }
    #container {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #111;
    }
    ruffle-player {
      width: 960px;
      height: 640px;
      max-width: 100%;
      max-height: 100%;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@ruffle-rs/ruffle@0.2.0-nightly.2025.10.2/ruffle.min.js"></script>
</head>
<body>

  <div id="container">
    <div id="player"></div>
  </div>

  <script>
    window.addEventListener("load", async () => {
      const ruffle = window.RufflePlayer?.newest?.();
      if (!ruffle) {
        alert("Ruffle failed to load. Please refresh the page.");
        return;
      }

      const player = ruffle.createPlayer();
      player.style.background = "#000";
      document.getElementById("player").appendChild(player);

      // Papa's Burgeria SWF
      const swfUrl = "https://cdn.jsdelivr.net/gh/SJRNoodles/Flash-Game-Archive@master/Papas%20Burgeria.swf";

      try {
        await player.load(swfUrl);
      } catch (err) {
        console.error(err);
        document.getElementById("player").innerHTML = `<h2 style="color:white;text-align:center;margin-top:100px;">Failed to load Papa's Burgeria.<br>Please refresh the page.</h2>`;
      }
    });
  </script>

</body>
</html>
